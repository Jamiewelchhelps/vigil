[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vigil"
version = "0.0.1"
description = "Every building, bridge and dam in America, watched from space."
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "xarray>=2025.1",
  "h5netcdf>=1.3",
  "h5py>=3.10",
  "fsspec>=2024.6",
  "aiohttp>=3.9",
  "requests>=2.31",
  "pyproj>=3.6",
  "shapely>=2.0",
  "rasterio>=1.4",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
